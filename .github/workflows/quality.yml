# Flock Quality Gates CI/CD
# Runs comprehensive quality checks on all pull requests and pushes
# Matches pre-commit hooks with additional test coverage requirements

name: Quality Gates

on:
  push:
    branches:
      - main # Replace with your default branch
      - 0.5.0b
      - ui-rework # dashboard rework (#557): its item PRs target this branch
  pull_request:
    branches:
      - main # Replace with your default branch
      - 0.5.0b
      - ui-rework

jobs:
  # Backend quality checks
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv sync --dev --all-groups --all-extras

      - name: Lint with Ruff
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run ruff check src/flock/ --fix --exit-zero

      - name: Format check with Ruff
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run ruff format --check src/flock/

      - name: Run tests with coverage
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pytest --cov=src/flock --cov-branch --cov-report=term --cov-fail-under=75

      - name: Backend build check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv build

  # Frontend quality checks
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/flock/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/flock/frontend
        run: npm ci

      - name: Type check
        working-directory: src/flock/frontend
        run: npm run type-check

      - name: Run tests
        working-directory: src/flock/frontend
        run: npm test

      - name: Frontend build check
        working-directory: src/flock/frontend
        run: npm run build

  # The build with the newest releases package.json allows, as an install that does not
  # keep to package-lock.json gets them (the job above builds with the lockfile)
  frontend-build-latest:
    name: Frontend Build (latest dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 10, which Node 22 ships, crashes resolving this tree without a lockfile
      # ("Cannot read properties of null (reading 'edgesOut')", at jsdom's optional peer canvas)
      - name: Set up npm 11
        run: npm install -g npm@11

      - name: Install the newest allowed dependencies
        working-directory: src/flock/frontend
        run: npm install --no-package-lock

      - name: Frontend build check
        working-directory: src/flock/frontend
        run: npm run build

  # The build on macOS, whose file system ignores case: modules whose names differ
  # only in case (PickedUpBy.tsx, pickedUpBy.ts) collide there, not on Linux
  frontend-build-macos:
    name: Frontend Build (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/flock/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/flock/frontend
        run: npm ci

      - name: Frontend build check
        working-directory: src/flock/frontend
        run: npm run build

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv sync --dev --all-groups --all-extras

      - name: Run Bandit security scan
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run bandit -c pyproject.toml -r src/flock/ -ll
