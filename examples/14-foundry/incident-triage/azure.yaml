# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: flock-incident-triage
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  flock-incident-triage:
    host: azure.ai.agent
    uses:
      - ai-project
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - Python
        - Flock
    project: src/flock-incident-triage
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    kind: hosted
    name: flock-incident-triage
    displayName: Flock Incident Triage (Python, Responses)
    description: Two Flock agents behind the Foundry Responses protocol, using the agent identity for model calls.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      MAX_COMPLETION_TOKENS: '4000'
      MAX_ACTIVE_WORKFLOWS: '8'
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
